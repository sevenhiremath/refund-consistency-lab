<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Refund Consistency{% endblock %}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1114;
      --surface: #15191d;
      --surface-2: #1a1f24;
      --border: #262c32;
      --border-soft: #1e242a;
      --text: #e9edf1;
      --text-soft: #a7b0ba;
      --rail: #0a0c0e;
      --rail-active: #1b2126;
      --emerald: #34d399;
      --emerald-bg: rgba(52, 211, 153, 0.12);
      --amber: #fbbf24;
      --amber-bg: rgba(251, 191, 36, 0.14);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.12);
      --focus: #7dd3fc;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15.5px/1.6 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      min-height: 100vh;
    }

    /* navigation rail */
    .rail {
      background: var(--rail);
      border-right: 1px solid var(--border);
      padding: 1.9rem 1.25rem;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand {
      display: block;
      color: var(--text);
      text-decoration: none;
      font-size: 1.02rem;
      font-weight: 650;
      letter-spacing: -0.015em;
      line-height: 1.25;
    }
    .brand span {
      display: block;
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-soft);
      margin-top: 0.45rem;
    }
    .rail nav { margin-top: 2.4rem; display: flex; flex-direction: column; gap: 0.15rem; }
    .rail nav a {
      color: var(--text-soft);
      text-decoration: none;
      padding: 0.5rem 0.65rem;
      border-radius: 5px;
      font-size: 0.94rem;
    }
    .rail nav a:hover { color: var(--text); background: var(--surface); }
    .rail nav a[aria-current="page"] {
      background: var(--rail-active);
      color: #fff;
      box-shadow: inset 2px 0 0 var(--emerald);
    }
    .rail-foot {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.76rem;
      line-height: 1.5;
      color: var(--text-soft);
    }

    main {
      padding: 3rem clamp(1.25rem, 3.4vw, 3.4rem) 5rem;
      max-width: 68rem;
      min-width: 0;
    }

    /* type */
    h1 {
      font-weight: 640;
      font-size: clamp(1.85rem, 3vw, 2.3rem);
      line-height: 1.16;
      letter-spacing: -0.022em;
      margin: 0.3rem 0 0.7rem;
      max-width: 34ch;
    }
    h2 {
      font-size: 0.98rem;
      font-weight: 620;
      letter-spacing: -0.005em;
      margin: 0 0 0.55rem;
    }
    h3 { font-size: 0.88rem; font-weight: 620; margin: 1.2rem 0 0.4rem; }
    p { margin: 0.45rem 0; max-width: 66ch; }
    .eyebrow {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-soft);
      margin: 0;
    }
    .lede {
      font-size: 1.04rem;
      color: var(--text-soft);
      max-width: 60ch;
      margin: 0 0 1.35rem;
    }
    .muted { color: var(--text-soft); }
    .small { font-size: 0.82rem; }
    code {
      font-family: var(--mono);
      font-size: 0.86em;
      letter-spacing: -0.01em;
    }
    a { color: var(--focus); text-underline-offset: 2px; }

    /* sections */
    section { border-top: 1px solid var(--border-soft); margin-top: 2.2rem; padding-top: 1.3rem; }
    section.tight { margin-top: 1.5rem; padding-top: 1rem; }
    section:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }

    /* actions */
    .actions { display: flex; flex-wrap: wrap; gap: 0.55rem; align-items: center; margin: 0.3rem 0 1rem; }
    .btn {
      display: inline-block;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 560;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      border: 1px solid var(--emerald);
      background: var(--emerald);
      color: #06251a;
      text-decoration: none;
      cursor: pointer;
    }
    .btn.secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }
    .btn.secondary:hover { border-color: var(--text-soft); }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: translateY(1px); }
    button {
      font: inherit;
      font-size: 0.86rem;
      font-weight: 540;
      padding: 0.4rem 0.8rem;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--text-soft); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    input, select {
      font: inherit;
      font-size: 0.86rem;
      padding: 0.36rem 0.45rem;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--bg);
      color: var(--text);
    }
    input[type="number"] { width: 5.2rem; }

    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .rail :focus-visible { outline-color: var(--focus); }

    /* tables */
    table { border-collapse: collapse; width: 100%; margin: 0.15rem 0 0; }
    th, td {
      text-align: left;
      padding: 0.5rem 0.65rem;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: top;
      font-size: 0.88rem;
    }
    th {
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-soft);
      font-weight: 600;
      border-bottom-color: var(--border);
      white-space: nowrap;
    }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: rgba(255, 255, 255, 0.015); }
    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .scroll { overflow-x: auto; }

    /* status */
    .chip {
      display: inline-block;
      padding: 0.08rem 0.45rem;
      border-radius: 3px;
      font-size: 0.73rem;
      font-weight: 620;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .chip.succeeded { background: var(--emerald-bg); color: var(--emerald); }
    .chip.review { background: var(--amber-bg); color: var(--amber); }
    .chip.pending { background: var(--surface-2); color: var(--text-soft); }
    .chip.failed { background: var(--danger-bg); color: var(--danger); }

    /* summary */
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      margin: 0 0 0.3rem;
      overflow: hidden;
    }
    .summary > div {
      flex: 1 1 8.5rem;
      padding: 0.8rem 1rem;
      border-right: 1px solid var(--border-soft);
    }
    .summary > div:last-child { border-right: 0; }
    .summary .label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-soft);
    }
    .summary .value {
      display: block;
      font-size: 1.28rem;
      font-variant-numeric: tabular-nums;
      margin-top: 0.12rem;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .summary .value.confirmed { color: var(--emerald); }
    .summary .value.review { color: var(--amber); }

    .reason {
      font-size: 0.86rem;
      color: var(--text-soft);
      margin: 0.55rem 0 0;
    }
    .reason b { color: var(--text); font-weight: 560; }
    .hint {
      font-size: 0.88rem;
      color: var(--text-soft);
      margin: 0.6rem 0 0;
      padding-left: 0.7rem;
      border-left: 2px solid var(--border);
    }

    /* meta */
    .meta { display: flex; flex-wrap: wrap; gap: 0.4rem 1.5rem; margin: 0.2rem 0 0; }
    .meta div { min-width: 6rem; }
    .meta dt {
      font-size: 0.64rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-soft);
    }
    .meta dd { margin: 0.1rem 0 0; font-size: 0.86rem; font-variant-numeric: tabular-nums; }

    /* controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: flex-end;
      margin: 0.8rem 0 0;
    }
    .controls form { display: flex; gap: 0.4rem; align-items: flex-end; margin: 0; }
    .controls label {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      font-size: 0.64rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-soft);
    }
    .busy-note { font-size: 0.8rem; color: var(--text-soft); }

    /* steps */
    .steps { list-style: none; padding: 0; margin: 0.3rem 0 0; }
    .steps li {
      display: grid;
      grid-template-columns: 1.8rem minmax(0, 1fr) auto;
      gap: 0.85rem;
      align-items: start;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border-soft);
    }
    .steps li:last-child { border-bottom: 0; }
    .step-num {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--text-soft);
      padding-top: 0.15rem;
    }
    .steps h2 { margin: 0 0 0.1rem; font-size: 0.96rem; }
    .steps p { margin: 0; font-size: 0.87rem; color: var(--text-soft); max-width: 56ch; }
    .steps .endpoint { margin: 0.3rem 0 0; font-size: 0.8rem; color: var(--text); }
    .steps form { margin: 0; }

    /* notes */
    .note {
      border-left: 2px solid var(--border);
      padding: 0.1rem 0 0.1rem 0.8rem;
      color: var(--text-soft);
      max-width: 62ch;
      margin: 0.8rem 0;
      font-size: 0.88rem;
    }
    .note strong { color: var(--text); }

    /* disclosures */
    details { border-top: 1px solid var(--border-soft); margin-top: 1.4rem; padding-top: 0.15rem; }
    details > summary {
      cursor: pointer;
      padding: 0.6rem 0;
      font-size: 0.88rem;
      font-weight: 560;
      color: var(--text);
      list-style-position: outside;
    }
    details > summary:hover { color: var(--focus); }
    details[open] > summary { color: var(--text); }
    .tech-body { padding: 0.1rem 0 0.6rem; }

    /* naive comparison disclosure */
    details.compare {
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      margin: 0.9rem 0 0;
      padding: 0 1rem;
    }
    details.compare > summary {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1rem;
      align-items: baseline;
      padding: 0.65rem 0;
    }
    details.compare .cmp-title { font-weight: 620; }
    details.compare .cmp-values {
      font-family: var(--mono);
      font-size: 0.84rem;
      color: var(--text-soft);
    }
    details.compare .cmp-values b { color: var(--text); font-weight: 600; }
    details.compare .cmp-values .ok { color: var(--emerald); }
    .compare-body { padding: 0 0 0.85rem; }

    /* code */
    pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.8rem 0.95rem;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 0.79rem;
      line-height: 1.55;
      margin: 0.55rem 0;
      color: var(--text);
    }
    pre code { font-size: inherit; }

    /* motion */
    @media (prefers-reduced-motion: no-preference) {
      a, button, input, select, summary {
        transition: background-color 0.15s ease, border-color 0.15s ease,
                    color 0.15s ease, opacity 0.15s ease;
      }
      details[open] > .tech-body,
      details[open] > .compare-body {
        animation: reveal 0.18s ease-out;
      }
      tr.is-new { animation: fresh 1.4s ease-out; }
    }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(-2px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes fresh {
      from { background: var(--emerald-bg); }
      to { background: transparent; }
    }

    @media (max-width: 780px) {
      body { grid-template-columns: minmax(0, 1fr); }
      .rail {
        position: static;
        height: auto;
        padding: 0.9rem 1.1rem;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.8rem;
        justify-content: space-between;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .brand { font-size: 0.98rem; }
      .brand span { display: none; }
      .rail nav { margin-top: 0; flex-direction: row; gap: 0.15rem; }
      .rail nav a { padding: 0.35rem 0.5rem; font-size: 0.86rem; }
      .rail nav a[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--emerald); }
      .rail-foot { display: none; }
      main { padding: 1.7rem 1.1rem 3.2rem; }
      h1 { font-size: 1.7rem; }
      .summary > div { flex-basis: 50%; border-bottom: 1px solid var(--border-soft); }
      .steps li { grid-template-columns: 1.4rem minmax(0, 1fr); }
      .steps li form { grid-column: 2; }
    }
  </style>
</head>
<body>
  <aside class="rail">
    <a class="brand" href="/">Refund Consistency<span>Notification processing</span></a>
    <nav aria-label="Primary">
      <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Overview</a>
      <a href="/walkthrough" {% if request.url.path == "/walkthrough" or request.url.path.startswith("/runs/") %}aria-current="page"{% endif %}>Demo</a>
      <a href="/integrate" {% if request.url.path == "/integrate" %}aria-current="page"{% endif %}>Integrate</a>
    </nav>
    <div class="rail-foot">
      Maintains refund records.<br>Does not move money.
    </div>
  </aside>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    document.addEventListener("submit", function (event) {
      var form = event.target;
      if (!form.matches || !form.matches("form[data-busy]")) return;
      form.setAttribute("aria-busy", "true");
      Array.prototype.forEach.call(form.querySelectorAll("button"), function (button) {
        button.disabled = true;
        if (button.dataset.busyLabel) button.textContent = button.dataset.busyLabel;
      });
      var note = form.querySelector("[data-busy-note]");
      if (note) note.hidden = false;
    });

    // Mark the newest timeline row only when it is actually new since the last
    // visit to this run. Values are already rendered by the server.
    (function () {
      var list = document.querySelector("[data-timeline]");
      if (!list || !window.sessionStorage) return;
      var rows = list.querySelectorAll("tbody tr[data-seq]");
      if (!rows.length) return;
      var last = rows[rows.length - 1];
      var key = "rc-timeline-" + (list.getAttribute("data-timeline") || "");
      var previous = null;
      try { previous = sessionStorage.getItem(key); } catch (error) { return; }
      if (previous !== null && previous !== last.getAttribute("data-seq")) {
        last.classList.add("is-new");
      }
      try { sessionStorage.setItem(key, last.getAttribute("data-seq")); } catch (error) {}
    })();
  </script>
</body>
</html>
